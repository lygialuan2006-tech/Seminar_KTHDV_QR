<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>{{ product.label }} · Thông tin sản phẩm</title>
    <link rel="stylesheet" href="/static/styles.css?v=2" />
  </head>
  <body class="confirm-page">
    <main class="confirm-card product-card">
      <p class="eyebrow">THÔNG TIN SẢN PHẨM</p>
      <h1>{{ product.label }}</h1>
      <p class="confirm-event">Mã sản phẩm: {{ product.referenceId }}</p>
      <p class="badge ok">Đang lưu hành</p>
      {% if product.batch %}
      <dl class="facts">
        <dt>Mã lô</dt>
        <dd>{{ product.batch }}</dd>
      </dl>
      {% endif %} {% if product.info %}
      <section class="product-info">
        <h2>Thông tin</h2>
        <p>{{ product.info }}</p>
      </section>
      {% endif %}
      <p class="note">
        Mã QR sản phẩm chỉ dùng để tra cứu. Bạn có thể quét lại nhiều lần.
      </p>
    </main>
  </body>
</html>
